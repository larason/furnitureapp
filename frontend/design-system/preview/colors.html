<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Furniture colors</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
      main { max-width: var(--container-max); margin: 0 auto; padding: var(--space-8) var(--space-6); }
      h1 { margin: 0 0 var(--space-6); font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-display); }

      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-4); }
      .swatch { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; box-shadow: var(--elev-ring); }
      .color { height: 88px; background: var(--value); }
      .meta { padding: var(--space-3); color: var(--muted); font-size: var(--text-sm); }
      strong { display: block; margin-bottom: var(--space-1); color: var(--fg); }

    </style>
  </head>
  <body>
    <main>
      <h1>Color roles</h1>

      <section class="grid">
        <article class="swatch" style="--value: var(--surface-canvas)"><div class="color"></div><div class="meta"><strong>Canvas</strong>--surface-canvas</div></article>
        <article class="swatch" style="--value: var(--surface-paper)"><div class="color"></div><div class="meta"><strong>Paper</strong>--surface-paper</div></article>
        <article class="swatch" style="--value: var(--surface-editorial)"><div class="color"></div><div class="meta"><strong>Editorial</strong>--surface-editorial</div></article>
        <article class="swatch" style="--value: var(--text-primary)"><div class="color"></div><div class="meta"><strong>Primary text</strong>--text-primary</div></article>
        <article class="swatch" style="--value: var(--text-secondary)"><div class="color"></div><div class="meta"><strong>Secondary text</strong>--text-secondary</div></article>
        <article class="swatch" style="--value: var(--accent-brand)"><div class="color"></div><div class="meta"><strong>Brand accent</strong>--accent-brand</div></article>
        <article class="swatch" style="--value: var(--success)"><div class="color"></div><div class="meta"><strong>Success</strong>--success</div></article>
        <article class="swatch" style="--value: var(--warn)"><div class="color"></div><div class="meta"><strong>Warning</strong>--warn</div></article>
        <article class="swatch" style="--value: var(--danger)"><div class="color"></div><div class="meta"><strong>Danger</strong>--danger</div></article>
      </section>

    </main>
  </body>
</html>
