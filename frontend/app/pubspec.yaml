name: sl_furnitures
description: "SL Furnitures customer application (Android)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  clerk_auth: ^0.0.18-beta
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  http: ^1.5.0
  http_parser: ^4.1.2
  marionette_flutter: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Young Serif
      fonts:
        - asset: assets/fonts/YoungSerif-Regular.ttf
