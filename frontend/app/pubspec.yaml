name: sl_furnitures
description: "SL Furnitures customer application (Android)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  clerk_auth: ^0.0.18-beta
  clerk_flutter: ^0.0.18-beta
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.2.4
  file_picker: ^13.1.0
  go_router: ^18.0.2
  http: ^1.5.0
  http_parser: ^4.1.2
  marionette_flutter: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Young Serif
      fonts:
        - asset: assets/fonts/YoungSerif-Regular.ttf
  assets:
    - assets/
    - assets/applogo/brandlogo.svg
    - assets/furnitures/fixtures/categories/living-room.jpg
    - assets/furnitures/fixtures/categories/bedroom.jpg
    - assets/furnitures/fixtures/categories/dining.jpg
    - assets/furnitures/fixtures/categories/office.jpg
    - assets/furnitures/fixtures/hero/chairs-heroimage.webp
    - assets/furnitures/fixtures/products/lounge-chair.jpg
    - assets/furnitures/fixtures/products/white-sofa.jpg
    - assets/furnitures/fixtures/products/barrel-armchair.jpg
    - assets/furnitures/fixtures/hero/hero.jpg
