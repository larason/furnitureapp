  /webhooks/payment/{provider}:
    post:
      operationId: WEBHOOK-001
      tags:
      - Webhooks
      summary: Payment provider webhook callback (Group H placeholder)
      description: System/Webhook endpoint for payment provider callbacks. Requires SYSTEM service auth via signature (not
        bearerAuth customer). Provider-specific payload and signature verification deferred to Group H. Must be idempotent.
        Requires valid X-Webhook-Signature header; unauthenticated requests are rejected 401.
      security:
      - webhookSignature: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - stripe
          - flutterwave
          - pesapal
        description: Payment provider identifier
      - name: X-Webhook-Signature
        in: header
        required: true
        schema:
          type: string
        description: Provider webhook HMAC/signature for SYSTEM verification (Group H). Rejects forged events with 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - event_id
              - payment_id
              - status
              properties:
                event_id:
                  type: string
                  description: Provider event id for idempotency
                payment_id:
                  type: string
                status:
                  type: string
                  enum:
                  - PAID
                  - FAILED
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
