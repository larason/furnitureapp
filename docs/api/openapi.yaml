      - slug
      - product_type
      - price
      - category_id
      properties:
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: URL-safe kebab-case
        description:
          type: string
          maxLength: 5000
        product_type:
          $ref: '#/components/schemas/ProductType'
        price:
          $ref: '#/components/schemas/Money'
        category_id:
          type: string
          description: Existing category id or slug
        is_active:
          type: boolean
          default: true
        is_published:
          type: boolean
          default: true
      additionalProperties: false
    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description:
          type: string
          maxLength: 5000
        product_type:
          $ref: '#/components/schemas/ProductType'
        price:
          $ref: '#/components/schemas/Money'
        category_id:
          type: string
        is_active:
          type: boolean
        is_published:
          type: boolean
      additionalProperties: false
    CategoryCreateRequest:
      type: object
      required:
      - name
      - slug
      properties:
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description:
          type:
          - string
          - 'null'
          maxLength: 1000
        image:
          type:
          - string
          - 'null'
          format: uri
      additionalProperties: false
    CategoryUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description:
          type:
          - string
          - 'null'
          maxLength: 1000
        image:
          type:
          - string
          - 'null'
          format: uri
      additionalProperties: false
    ProductImage:
      type: object
      required:
      - id
      - url
      - alt_text
      - sort_order
      - is_primary
      properties:
        id:
          type: string
          readOnly: true
          example: img_01h8x9a0b1c2d3e4f5g6h7j8
        url:
          type: string
          format: uri
          readOnly: true
          example: https://cdn.example.com/products/oak-table.webp
        alt_text:
          type: string
          readOnly: true
          example: Solid Oak Dining Table front view
        sort_order:
          type: integer
          minimum: 1
          readOnly: true
          example: 1
        is_primary:
          type: boolean
          readOnly: true
          example: true
    VariantSummary:
      type: object
      required:
      - id
      - sku
      - name
      - price
      - availability
      - stock_indicator
      properties:
        id:
          type: string
          readOnly: true
          example: var_01h8x9k1m2n3p4q5r6s7t8u9
        sku:
          type: string
          example: OAK-TABLE-6S-NAT
        name:
          type: string
          example: Natural Oak
        price:
          $ref: '#/components/schemas/Money'
        availability:
          $ref: '#/components/schemas/Availability'
        stock_indicator:
          $ref: '#/components/schemas/StockIndicator'
    OrderItem:
      type: object
      required:
      - product_id
      - sku
      - name
      - unit_price
      - quantity
      - line_total
      properties:
        product_id:
          type: string
          readOnly: true
          example: prod_01h8x9j2m4k5n6p7q8r9s0t1
        variant_id:
          type:
          - string
          - 'null'
          readOnly: true
          example: var_01h8x9k1m2n3p4q5r6s7t8u9
        sku:
          type: string
          readOnly: true
          example: OAK-TABLE-6S-NAT
        name:
          type: string
          readOnly: true
          example: Solid Oak Dining Table
          description: Snapshot at purchase
        variant_name:
          type:
          - string
          - 'null'
          readOnly: true
          example: Natural Oak
        unit_price:
          $ref: '#/components/schemas/Money'
          readOnly: true
          description: Historical unit price at purchase
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          readOnly: true
          example: 1
        line_total:
          $ref: '#/components/schemas/Money'
          readOnly: true
          description: unit_price * quantity snapshot
        primary_image:
          type:
          - object
          - 'null'
          properties:
            url:
              type: string
              format: uri
              readOnly: true
          readOnly: true
          description: Optional display snapshot
