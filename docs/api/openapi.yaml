  /me/cart:
    get:
      operationId: CART-001
      tags:
      - Cart
      summary: Get cart
      security:
      - bearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/GuestCartId'
      - $ref: '#/components/parameters/GuestCartCookie'
      responses:
        '200':
          description: >-
            The holder's ACTIVE cart. A first anonymous read without a guest credential returns a transient empty
            cart representation (`items: []`, `items_count: 0`, zero subtotal) that is not persisted and issues no
            credential; its `id` is an opaque per-request handle and `updated_at` is the response time, so clients
            must not rely on either for continuity. A valid guest credential returns the persisted guest cart.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: >-
        Return the holder's ACTIVE cart. Optional Clerk bearer; anonymous guests may present an existing guest
        credential (cookie or header). An authenticated read may lazily create the customer's cart; an anonymous
        read without a guest credential does not persist a cart. This operation never issues a guest credential —
        that is issued only by the first successful CART-002 mutation. An invalid attempted bearer or guest
        credential returns 401.
  /me/cart/items:
    post:
      operationId: CART-002
      tags:
      - Cart
      summary: Add item
      description: >-
        Adds a purchasable line, merging duplicates. A cart holds at most 100 distinct `(product_id, variant_id)`
        lines; adding a new line beyond the cap returns `422 INVALID_VALUE`. Every mutation locks the holder cart
        row first and requires it to still be `ACTIVE`, so a mutation racing `CART-005` merge (source cart retired)
        returns `409 CONFLICT` instead of writing to the inactive cart.
      security:
      - bearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/GuestCartId'
      - $ref: '#/components/parameters/GuestCartCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '201':
          description: Created (new line); duplicate additions merge into an existing line and return 200
          headers:
            Set-Cookie:
              description: Browser guest credential, issued only when a new guest cart is created
              schema:
                type: string
            X-Guest-Cart-Id:
              description: Non-browser guest credential, issued only when a new guest cart is created
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
        '200':
          description: OK (quantity merged into an existing (product_id, variant_id) line, clamped to 100)
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/cart/items/{item}:
    patch:
      operationId: CART-003
      tags:
      - Cart
      summary: Update item
      security:
      - bearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/ItemPath'
      - $ref: '#/components/parameters/GuestCartId'
      - $ref: '#/components/parameters/GuestCartCookie'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      description: Holder-scoped; Customer A -> Customer B item returns 404 CART_ITEM_NOT_FOUND masked (not 403); ownership
        via /me context. A mutation racing CART-005 merge on a retired cart returns 409 CONFLICT.
    delete:
      operationId: CART-004
      tags:
      - Cart
      summary: Remove item
      security:
      - bearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/ItemPath'
      - $ref: '#/components/parameters/GuestCartId'
      - $ref: '#/components/parameters/GuestCartCookie'
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
          $ref: '#/components/responses/Conflict'
      description: >-
        Bodyless action: a non-empty request body is rejected `422 INVALID_VALUE` (empty/`[]`/`{}` accepted).
        Holder-scoped; Customer A -> Customer B item returns 404 CART_ITEM_NOT_FOUND masked (not 403); ownership
        via /me context. A mutation racing CART-005 merge on a retired cart returns 409 CONFLICT.
  /me/cart/merge:
    post:
      operationId: CART-005
      tags:
      - Cart
      summary: Merge guest cart
      description: >-
        Bodyless authenticated action. A non-empty request body is rejected `422 INVALID_VALUE` (empty/`[]`/`{}`
        accepted). Locks the source and target cart rows and source lines, so a concurrent guest mutation
        serialises and never lands on the retired source cart; a merge that would exceed the 100 distinct-line
        cap is rejected `422 INVALID_VALUE` with the source left `ACTIVE`.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/GuestCartId'
      - $ref: '#/components/parameters/GuestCartCookie'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /checkout:
    post:
      operationId: CHK-001
      tags:
      - Checkout
      summary: Checkout
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            examples:
              pickup:
                summary: PICKUP
                value:
                  fulfillment_type: PICKUP
              delivery:
