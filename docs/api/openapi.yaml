    post:
      operationId: PAY-001
      tags:
      - Payment
      summary: Initiate payment (Group H placeholder)
      description: Initiate payment for an order with finalized total (delivery_fee_status=FINALIZED). Amount is server-calculated
        from Order total (subtotal+delivery_fee) minor units TZS. Customer cannot supply amount. Requires AUTHENTICATED_OWNER
        own order, Idempotency-Key Required, delivery_fee must be FINALIZED else 409 DELIVERY_FEE_PENDING. PROPOSED* placeholder
        — provider-specific payload deferred to Group H.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - order_id
              properties:
                order_id:
                  type: string
                  description: Order id (opaque ord_...) with finalized total — sole identifier for payment initiation. order_reference (OD-*****) is server-generated, never client-supplied; do not send order_reference.
              additionalProperties: false
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      payment_id:
                        type: string
                      order_id:
                        type: string
                      amount:
                        $ref: '#/components/schemas/Money'
                      status:
                        type: string
                        enum:
                        - PENDING
                        - PAID
                        - FAILED
